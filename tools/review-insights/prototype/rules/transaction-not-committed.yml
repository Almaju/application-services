id: transaction-not-committed
language: rust
severity: warning
message: "Transaction is never committed in this function; dropping it rolls everything back."
ignores: ["**/tests/**", "**/*_tests.rs", "**/test_*.rs", "**/benches/**", "**/examples/**"]
rule:
  pattern: let $TX = $INIT;
  inside:
    kind: function_item
    stopBy: end
    not:
      follows:
        kind: attribute_item
        regex: "test"
  not:
    any:
      - inside:
          kind: mod_item
          stopBy: end
          has: { field: name, regex: "test" }
      - precedes:
          stopBy: end
          any:
            - has: { stopBy: end, pattern: $TX.commit() }
            - has: { stopBy: end, pattern: $TX.commit_if_not_interrupted() }
            - has: { stopBy: end, pattern: $TX.rollback() }
            - pattern: Ok($TX)
            - has: { stopBy: end, pattern: Ok($TX) }
            - pattern: $TX
constraints:
  INIT:
    regex: "(unchecked_transaction|\\.transaction|begin_transaction|transaction_with_behavior)\\("
