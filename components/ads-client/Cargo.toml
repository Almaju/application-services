[package]
name = "ads-client"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
exclude = ["/android"]

[features]
dev = []
default = ["glean-sym"]
# Record metrics through glean-sym (mobile only, see the note on the dependency
# below). With this off, every recording site compiles down to a no-op.
glean-sym = ["dep:glean-sym"]

[dependencies]
chrono = "0.4"
context_id = { path = "../context_id" }
error-support = { path = "../support/error" }
parking_lot = "0.12"
rusqlite = { version = "0.37.0", features = [
  "functions",
  "bundled",
  "serde_json",
  "unlock_notify",
] }
serde = "1"
serde_json = "1"
thiserror = "2"
once_cell = "1.5"
uniffi = { version = "0.31" }
url = { version = "2", features = ["serde"] }
url-macro = { path = "../support/url-macro" }
uuid = { version = "1.3", features = ["v4"] }
viaduct = { path = "../viaduct", features = ["ohttp"] }
sql-support = { path = "../support/sql" }

# glean-sym looks Glean's FFI symbols up in the host application at runtime, so
# it only makes sense where that application embeds Glean: Android and iOS.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
glean-sym = { git = "https://github.com/mozilla/glean", tag = "v68.0.0", optional = true }

[dev-dependencies]
mockall = "0.12"
mockito = { version = "0.31", default-features = false }
viaduct-dev = { path = "../support/viaduct-dev" }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }
glean-build = { git = "https://github.com/mozilla/glean", tag = "v68.0.0" }
