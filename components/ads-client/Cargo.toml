[package]
name = "ads-client"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
exclude = ["/android"]

[features]
dev = []
default = []
# Record the metrics in `glean/` through glean-sym rather than the
# `MozAdsTelemetrySink` callback. The mobile megazords enable it.
glean-sym = ["dep:glean-sym"]
stateful = []

[dependencies]
chrono = "0.4"
context_id = { path = "../context_id" }
error-support = { path = "../support/error" }
glean-sym = { version = "70", optional = true }
parking_lot = "0.12"
rusqlite = { version = "0.37.0", features = [
  "functions",
  "bundled",
  "serde_json",
  "unlock_notify",
] }
serde = "1"
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
once_cell = "1.5"
uniffi = { version = "0.32" }
url = { version = "2", features = ["serde"] }
url-macro = { path = "../support/url-macro" }
uuid = { version = "1.3", features = ["v4"] }
viaduct = { path = "../viaduct", features = ["ohttp"] }
sql-support = { path = "../support/sql" }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
mockall = "0.12"
mockito = { version = "0.31", default-features = false }
viaduct-dev = { path = "../support/viaduct-dev" }

[build-dependencies]
glean-build = { git = "https://github.com/mozilla/glean", tag = "v70.2.0" }
uniffi = { version = "0.32", features = ["build"] }
