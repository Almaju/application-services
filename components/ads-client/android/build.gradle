buildscript {
    if (gradle.hasProperty("mozconfig")) {
        repositories {
            gradle.mozconfig.substs.GRADLE_MAVEN_REPOSITORIES.each { repository ->
                maven {
                    url = repository
                    if (gradle.mozconfig.substs.ALLOW_INSECURE_GRADLE_REPOSITORIES) {
                        allowInsecureProtocol = true
                    }
                }
            }
        }

        dependencies {
            classpath libs.mozilla.glean.gradle.plugin
            classpath libs.kotlin.serialization
        }
    }
}

if (!gradle.hasProperty("mozconfig")) {
    apply plugin: libs.plugins.python.envs.plugin.get().pluginId
}

// The object metric `ads_client.unexpected_error` generates serializable classes.
apply plugin: 'kotlinx-serialization'

apply from: "$appServicesRootDir/build-scripts/component-common.gradle"
apply from: "$publishDir/publish.gradle"

ext {
    gleanNamespace = "mozilla.telemetry.glean"
    gleanYamlFiles = ["${project.projectDir}/../metrics.yaml", "${project.projectDir}/../pings.yaml"]
    if (gradle.hasProperty("mozconfig")) {
        gleanPythonEnvDir = gradle.mozconfig.substs.GRADLE_GLEAN_PARSER_VENV
    }
}
apply plugin: "org.mozilla.telemetry.glean-gradle-plugin"

android {
    namespace 'org.mozilla.appservices.adsclient'
}

dependencies {
    implementation libs.mozilla.glean
    implementation libs.kotlinx.serialization.json

    testImplementation libs.mozilla.glean.forUnitTests
}

ext.configureUniFFIBindgen("ads_client")
ext.dependsOnTheMegazord()
ext.configurePublish(appServicesGroupId, project.name, project.ext.description)
