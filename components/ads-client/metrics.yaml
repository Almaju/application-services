---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0


ads_client:
  build_cache_error:
    type: labeled_string
    description: >
      Errors encountered when building the HTTP cache, labeled by error type.
      The string value contains the error message or error type. Only
      expected errors, such as a full disk; the others are in
      `ads_client.error_reports`.
    labels:
      - builder_error
      - database_error
      - empty_db_path
      - invalid_max_size
      - invalid_ttl
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  client_error:
    type: labeled_string
    description: >
      Errors encountered when using the ads client, labeled by operation type.
      The string value contains the error message or error type. Errors are
      recorded even if they are propagated to the consumer. Only expected
      errors, such as timeouts or 5xx responses; the others are in
      `ads_client.error_reports`.
    labels:
      - record_click
      - record_impression
      - report_ad
      - request_ads
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - interaction
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  client_operation_total:
    type: labeled_counter
    description: >
      The total number of operations attempted by the ads client, labeled by
      operation type. Used as the denominator for client_operation_success_rate.
    labels:
      - new
      - record_click
      - record_impression
      - report_ad
      - request_ads
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - interaction
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  deserialization_error:
    type: labeled_string
    description: >
      Deserialization errors encountered when parsing AdResponse data,
      labeled by error type. The string value contains the error message or
      details. Invalid ad items are skipped but these errors are tracked for
      monitoring data quality issues. No longer recorded: see
      `ads_client.error_reports`.
    labels:
      - invalid_ad_item
      - invalid_array
      - invalid_structure
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  http_cache_outcome:
    type: labeled_string
    description: >
      The total number of outcomes encountered during read operations on the
      http cache, labeled by type. The string value contains the error message or
      error type. Unexpected failures are in `ads_client.error_reports`.
    labels:
      - cleanup_failed
      - hit
      - lookup_failed
      - miss_not_cacheable
      - miss_stored
      - no_cache
      - store_failed
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  error_reports:
    type: object
    lifetime: ping
    send_in_pings:
      - ads-client-errors
    description: >
      Errors that point to a bug or a broken contract, such as a response that
      does not deserialize or an SQL error. One record per distinct error,
      identified by its fingerprint `fp`; repeats only increase `count`. Records
      hold no free text except a scrubbed message, and no URLs, response bodies,
      paths or identifiers. The values of `kind`, `op`, `stage` and the
      `context` keys are listed in `docs/telemetry.md`.
    structure:
      type: object
      properties:
        v:
          type: number
        dropped:
          type: number
        records:
          type: array
          items:
            type: object
            properties:
              fp:
                type: string
              kind:
                type: string
              op:
                type: string
              stage:
                type: string
              fatal:
                type: boolean
              chain:
                type: array
                items:
                  type: string
              message:
                type: string
              location:
                type: string
              steps:
                type: array
                items:
                  type: string
              context:
                type: array
                items:
                  type: object
                  properties:
                    k:
                      type: string
                    v:
                      type: string
              count:
                type: number
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047640
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047640
    data_sensitivity: [technical]
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never
