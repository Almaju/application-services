---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0


ads_client:
  client_error:
    type: labeled_string
    description: >
      Errors encountered when using the ads client, labeled by operation type.
      The string value contains the error message or error type. Errors are
      recorded even if they are propagated to the consumer.
    labels:
      - record_click
      - record_impression
      - report_ad
      - request_ads
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - interaction
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  client_operation_total:
    type: labeled_counter
    description: >
      The total number of operations attempted by the ads client, labeled by
      operation type. Used as the denominator for client_operation_success_rate.
    labels:
      - new
      - record_click
      - record_impression
      - report_ad
      - request_ads
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - interaction
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  http_cache_outcome:
    type: labeled_string
    description: >
      The total number of outcomes encountered during read operations on the
      http cache, labeled by type. The string value contains the error message or
      error type.
    labels:
      - cleanup_failed
      - hit
      - lookup_failed
      - miss_not_cacheable
      - miss_stored
      - no_cache
      - store_failed
    bugs:
      - https://github.com/mozilla/application-services/pull/7111
    data_reviews:
      - https://github.com/mozilla/application-services/pull/7111
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never

  unexpected_error:
    type: object
    lifetime: ping
    send_in_pings:
      - ads-client-errors
    description: >
      An error that points to a bug or a broken contract, such as an ad that
      does not deserialize, an invalid cache configuration or an SQL error.
      `kind` says which, `message` is the error's message, cut to 1 KiB.
    structure:
      type: object
      properties:
        kind:
          type: string
        message:
          type: string
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047640
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2047640
    data_sensitivity:
      - technical
    notification_emails:
      - ahanot@mozilla.com
      - llisi@mozilla.com
      - toast@mozilla.com
    expires: never
